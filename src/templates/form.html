<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выберите шаблон</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --raci-accent-color: {{ raci_accent_color }};
        }
        #raci-form .form-check-input {
            border-color: var(--raci-accent-color);
        }
        #raci-form .form-check-input:checked {
            background-color: var(--raci-accent-color);
            border-color: var(--raci-accent-color);
        }
        #raci-form .form-check-input:focus {
            border-color: var(--raci-accent-color);
            box-shadow: 0 0 0 0.25rem color-mix(in srgb, var(--raci-accent-color) 40%, transparent);
        }
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 16px;
        }
        .form-label {
            font-weight: 600;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-end mb-3"><a href="{{ url_for('admin_editor') }}">Панель администратора</a></div>

                    <h2 class="mb-4 text-center fw-bold">
                        Выберите шаблон
                    </h2>

                    <div class="mb-4">
                        <select class="form-select" id="template-select"
                                aria-label="Шаблон" aria-controls="meeting-form raci-form">
                            <option value="meetings" {% if not raci_error %}selected{% endif %}>Встречи</option>
                            <option value="raci" {% if raci_error %}selected{% endif %}>Матрица RACI</option>
                        </select>
                    </div>

                    {% include 'raci_form.html' %}

                    <form id="meeting-form" action="/ft_generate" method="post">

                        <!-- Название встречи -->
                        <div class="mb-4">
                            <label class="form-label">Название встречи</label>
                                <select class="form-select" name="meeting_name">
                                    <option value="встреча 1 месяца">Встреча 1 месяца</option>
                                    <option value="встреча 2 месяца">Встреча 2 месяца</option>
                                    <option value="встреча 3 месяца">Встреча 3 месяца</option>
                                    <option value="встреча 6 месяца">Встреча 6 месяца</option>
                                    <option value="запрос">Запрос</option>
                                </select>
                        </div>

                        <!-- Дата + Риски -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Дата встречи</label>
                                <input type="date" class="form-control"
                                       name="meeting_date" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Наличие рисков</label>
                                <select class="form-select" name="risks">
                                    <option value="существенных рисков не выявлено">
                                        Существенных рисков не выявлено
                                    </option>
                                    <option value="обрати внимание">Обрати внимание</option>
                                    <option value="есть риски">Есть риски</option>
                                </select>
                            </div>
                        </div>

                        <!-- ФИО -->
                        <div class="mb-4">
                            <label class="form-label">ФИО сотрудника</label>
                            <input type="text" class="form-control"
                                   name="fio" required>
                        </div>

                        <!-- Общие впечатления -->
                        <div class="mb-4">
                            <label class="form-label">Общие впечатления</label>
                            <textarea class="form-control" name="impressions"
                                      rows="4"
                                      placeholder="Опишите общее впечатление..."></textarea>
                        </div>

                        <!-- Мотиваторы -->
                        <div class="mb-4">
                            <label class="form-label">Мотиваторы</label>
                            <textarea class="form-control" name="motivators"
                                      rows="4"
                                      placeholder="Что мотивирует сотрудника..."></textarea>
                        </div>

                        <!-- Значимые факторы -->
                        <div class="mb-4">
                            <label class="form-label">
                                Значимые факторы
                                <small class="text-muted">(каждый с новой строки)</small>
                            </label>
                            <textarea class="form-control" name="factors"
                                      rows="4"
                                      placeholder="Каждый фактор вводится с новой строки"></textarea>
                        </div>

                        <!-- Области внимания -->
                        <div class="mb-4">
                            <label class="form-label">Области внимания</label>
                            <textarea class="form-control" name="attention"
                                      rows="4"
                                      placeholder="Зоны роста и фокус внимания..."></textarea>
                        </div>

                        <!-- Кнопка -->
                        <div class="d-grid mt-4">
                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                🚀 Сгенерировать отчет
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const templateSelect = document.getElementById('template-select');
    const meetingForm = document.getElementById('meeting-form');
    const raciForm = document.getElementById('raci-form');

    function updateTemplate() {
        const showMeetings = templateSelect.value === 'meetings';
        meetingForm.hidden = !showMeetings;
        raciForm.hidden = showMeetings;
    }

    templateSelect.addEventListener('change', updateTemplate);
    raciForm.addEventListener('submit', async (event) => {
        if (!event.submitter || event.submitter.id !== 'raci-submit') return;
        event.preventDefault();
        const error = document.getElementById('raci-error');
        const button = document.getElementById('raci-submit');
        error.hidden = true;
        button.disabled = true;
        button.textContent = 'Создаём PDF…';
        try {
            const response = await fetch(raciForm.action, {method: 'POST', body: new FormData(raciForm)});
            if (!response.ok) {
                const result = await response.json();
                throw new Error(result.error || 'Не удалось создать PDF. Повторите попытку.');
            }
            const url = URL.createObjectURL(await response.blob());
            const link = document.createElement('a');
            link.href = url;
            link.download = 'raci.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (failure) {
            error.textContent = failure.message || 'Не удалось создать PDF. Повторите попытку.';
            error.hidden = false;
        } finally {
            button.disabled = false;
            button.textContent = 'Сгенерировать PDF';
        }
    });
    updateTemplate();
</script>
</body>
</html>
