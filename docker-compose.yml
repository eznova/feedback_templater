services:
  feedback_templater:
    container_name: feedback_templater
    # build: .
    image: feedback_templater
    restart: always
    environment:
      SECRET_KEY: change-me-in-production
    networks:
      - moc
    volumes:
      - ./:/app
    ports:
      - "5081:5000"
networks:
  moc:
    external: true

