services:
  feedback_templater:
    container_name: feedback_templater
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    image: feedback_templater
    restart: always
    ports:
      - "5081:18500"
    environment:
      - RACI_ACCENT_COLOR
    networks:
      - moc
    volumes:
      - ./instance:/app/instance
networks:
  moc:
    external: true

