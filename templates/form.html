<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма встречи</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 16px;
        }
        .form-label {
            font-weight: 600;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-lg border-0">
                <div class="card-body p-5">

                    <h2 class="mb-4 text-center fw-bold">
                        Заполните данные встречи
                    </h2>

                    <form action="/generate" method="post">

                        <!-- Название встречи -->
                        <div class="mb-4">
                            <label class="form-label">Название встречи</label>
                                <select class="form-select" name="meeting_name">
                                    <option value="встреча 1 месяца">Встреча 1 месяца</option>
                                    <option value="встреча 2 месяца">Встреча 2 месяца</option>
                                    <option value="встреча 3 месяца">Встреча 3 месяца</option>
                                    <option value="встреча 6 месяца">Встреча 6 месяца</option>
                                    <option value="запрос">Запрос</option>
                                </select>
                        </div>

                        <!-- Дата + Риски -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Дата встречи</label>
                                <input type="date" class="form-control"
                                       name="meeting_date" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Наличие рисков</label>
                                <select class="form-select" name="risks">
                                    <option value="существенных рисков не выявлено">
                                        Существенных рисков не выявлено
                                    </option>
                                    <option value="обрати внимание">Обрати внимание</option>
                                    <option value="есть риски">Есть риски</option>
                                </select>
                            </div>
                        </div>

                        <!-- ФИО -->
                        <div class="mb-4">
                            <label class="form-label">ФИО сотрудника</label>
                            <input type="text" class="form-control"
                                   name="fio" required>
                        </div>

                        <!-- Общие впечатления -->
                        <div class="mb-4">
                            <label class="form-label">Общие впечатления</label>
                            <textarea class="form-control" name="impressions"
                                      rows="4"
                                      placeholder="Опишите общее впечатление..."></textarea>
                        </div>

                        <!-- Мотиваторы -->
                        <div class="mb-4">
                            <label class="form-label">Мотиваторы</label>
                            <textarea class="form-control" name="motivators"
                                      rows="4"
                                      placeholder="Что мотивирует сотрудника..."></textarea>
                        </div>

                        <!-- Значимые факторы -->
                        <div class="mb-4">
                            <label class="form-label">
                                Значимые факторы
                                <small class="text-muted">(каждый с новой строки)</small>
                            </label>
                            <textarea class="form-control" name="factors"
                                      rows="4"
                                      placeholder="Каждый фактор вводится с новой строки"></textarea>
                        </div>

                        <!-- Области внимания -->
                        <div class="mb-4">
                            <label class="form-label">Области внимания</label>
                            <textarea class="form-control" name="attention"
                                      rows="4"
                                      placeholder="Зоны роста и фокус внимания..."></textarea>
                        </div>

                        <!-- Кнопка -->
                        <div class="d-grid mt-4">
                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                🚀 Сгенерировать отчет
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
